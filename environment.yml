# Dedicated environment for PatternStim.
#   conda env create -f environment.yml
#   conda activate patternstim
#   python -m patternstim gui
# conda-forge is used on purpose: it ships a libstdc++ recent enough for the system OpenGL drivers.
name: patternstim
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy>=1.24,<2
  - scipy
  - scikit-image>=0.20
  - tifffile
  - imageio
  - pillow
  - matplotlib-base
  - pyqt=5.15.*
  - pyqtgraph=0.13.*
  - pytest
